name: Refresh publication metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.25'
      - run: python scripts/sync_publications.py
      - run: python -m unittest discover -s tests -v
      - run: quarto render
      - run: python scripts/check_site.py
      - name: Propose bibliography updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/publication-metadata
          commit-message: Refresh publication metadata
          title: Refresh publication metadata
          body: |
            Updates retrieved from public ORCID and DOI records. Saved records are retained when a lookup fails.

            Review data/sync-report.json for lookup failures and check publication changes before merging.
          add-paths: |
            data/publications-cache.json
            data/sync-report.json
            _generated/publications.html

